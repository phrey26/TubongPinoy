<main class="pt-20 px-6 pb-16 bg-gradient-to-b from-purple-100 via-pink-100 to-blue-100 min-h-screen flex items-center justify-center relative overflow-hidden">

  <div class="absolute -top-10 -left-10 w-64 h-64 bg-purple-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50"></div>
  <div class="absolute -bottom-10 -right-10 w-64 h-64 bg-blue-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50"></div>

  <section class="max-w-md w-full bg-white p-8 rounded-[2.5rem] shadow-2xl border-4 border-purple-300 relative z-10">

    <a routerLink="/" class="absolute -top-5 -left-5 bg-yellow-400 border-4 border-yellow-600 p-3 rounded-2xl shadow-[0_4px_0_#92400e] hover:-translate-y-1 transition active:translate-y-0.5 flex items-center justify-center text-xl" title="Back to Home">
      <img src="assets/icons/home.svg" alt="" aria-hidden="true" class="app-icon" />
    </a>

    <div class="text-center mb-8">
      <h1 class="text-4xl font-extrabold text-purple-700 drop-shadow-sm mb-2">
        Welcome Back!
      </h1>
      <p class="text-gray-600 font-medium italic">Log in to play games and visit the shop. Browsing the lobby is free.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
      @if (errorMessage()) {
        <p role="alert" class="rounded-xl bg-red-50 p-3 font-semibold text-red-700">{{ errorMessage() }}</p>
      }

      <div class="relative">
        <label for="login-identity" class="block text-purple-700 font-bold mb-2 ml-1">Username or Email</label>
        <input
          formControlName="identity"
          id="login-identity" autocomplete="username" maxlength="254"
          type="text"
          placeholder="Enter username"
          [class.border-red-400]="f.identity.invalid && f.identity.touched"
          class="w-full px-5 py-4 rounded-2xl border-4 border-blue-200 focus:border-blue-400 focus:outline-none transition bg-blue-50 text-gray-700 font-medium placeholder-blue-300" />

        <div *ngIf="f.identity.invalid && f.identity.touched" class="text-red-500 text-xs font-bold mt-1 ml-2">
          <img src="assets/icons/warning.svg" alt="" aria-hidden="true" class="app-icon" /> Enter your username or email.
        </div>
      </div>

      <div class="relative">
        <label for="login-password" class="block text-purple-700 font-bold mb-2 ml-1">Password</label>
        <div class="relative">
          <input
            formControlName="password"
            id="login-password" autocomplete="current-password"
            [type]="showPassword ? 'text' : 'password'"
            placeholder="••••••••"
            [class.border-red-400]="f.password.invalid && f.password.touched"
            class="w-full px-5 py-4 rounded-2xl border-4 border-pink-200 focus:border-pink-400 focus:outline-none transition bg-pink-50 text-gray-700 font-medium placeholder-pink-300" />

          <button
            type="button"
            (click)="togglePassword()"
            class="absolute right-4 top-1/2 -translate-y-1/2 text-xl hover:scale-110 transition active:scale-95">
            <img [src]="showPassword ? 'assets/icons/eye-off.svg' : 'assets/icons/eye.svg'" [alt]="showPassword ? 'Hide password' : 'Show password'" class="app-icon" />
          </button>
        </div>

        <div *ngIf="f.password.invalid && f.password.touched" class="text-red-500 text-xs font-bold mt-1 ml-2">
          <img src="assets/icons/warning.svg" alt="" aria-hidden="true" class="app-icon" /> Enter your password.
        </div>
      </div>

      <div class="flex items-center justify-between px-1">
        <label class="flex items-center cursor-pointer group">
          <input type="checkbox" formControlName="rememberMe" class="sr-only peer">
          <div class="w-6 h-6 border-4 border-purple-200 rounded-lg bg-white peer-checked:bg-purple-500 peer-checked:border-purple-700 transition flex items-center justify-center text-white text-xs">
            <img src="assets/icons/check.svg" alt="" aria-hidden="true" class="app-icon" />
          </div>
          <span class="ml-2 text-sm font-bold text-gray-600 group-hover:text-purple-700 transition">Remember Me</span>
        </label>
      </div>

      <button type="submit"
        [disabled]="loginForm.invalid || isSubmitting()"
        class="w-full py-4 bg-green-400 border-4 border-green-600 rounded-2xl
        shadow-[0_6px_0_#14532d] hover:-translate-y-1 hover:shadow-[0_8px_0_#14532d]
        active:translate-y-1 active:shadow-[0_2px_0_#14532d] transition-all font-bold text-xl text-white tracking-widest
        disabled:opacity-50 disabled:cursor-not-allowed disabled:translate-y-0 disabled:shadow-none mt-2">
        <img src="assets/icons/games.svg" alt="" aria-hidden="true" class="app-icon" /> {{ isSubmitting() ? 'LOGGING IN…' : 'LOG IN & CONTINUE' }}
      </button>

    </form>

    <div class="mt-8 text-center border-t-4 border-dashed border-gray-100 pt-6">
      <p class="text-gray-600 font-medium">
        New to the game?
        <a routerLink="/signup" [queryParams]="{ returnUrl: returnUrl }" class="text-purple-700 font-extrabold hover:underline ml-1">Create Account</a>
      </p>
    </div>

  </section>
</main>
