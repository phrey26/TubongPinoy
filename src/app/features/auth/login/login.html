<main class="ui-page auth-page pt-20 px-6 pb-16 bg-gradient-to-b from-purple-100 via-pink-100 to-blue-100 min-h-screen flex items-center justify-center relative overflow-hidden">

  <div class="absolute -top-10 -left-10 w-64 h-64 bg-purple-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50"></div>
  <div class="absolute -bottom-10 -right-10 w-64 h-64 bg-blue-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50"></div>

  <section class="auth-card max-w-md w-full bg-white p-8 rounded-[2.5rem] shadow-2xl border-4 border-purple-300 relative z-10">

    <a routerLink="/" class="auth-back"><img src="assets/icons/back.svg" alt="" aria-hidden="true" class="app-icon" /> Back to Home</a>

    <div class="text-center mb-8">
      <h1 class="text-4xl font-extrabold text-purple-700 drop-shadow-sm mb-2">
        Welcome Back!
      </h1>
      <p class="text-gray-600 font-medium italic">Log in to play games and visit the shop. Browsing the lobby is free.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
      @if (errorMessage()) {
        <p role="alert" class="ui-feedback ui-feedback-error">{{ errorMessage() }}</p>
      }

      <div class="relative">
        <label for="login-identity" class="block text-purple-700 font-bold mb-2 ml-1">Username or Email</label>
        <input
          formControlName="identity"
          id="login-identity" autocomplete="username" maxlength="254"
          type="text"
          placeholder="Username or email"
          [class.border-red-400]="f.identity.invalid && f.identity.touched" [attr.aria-invalid]="!!(f.identity.invalid && f.identity.touched)" [attr.aria-describedby]="f.identity.invalid && f.identity.touched ? 'login-identity-error' : null"
          class="auth-input w-full px-5 py-4 rounded-2xl border-4 border-blue-200 focus:border-blue-400 focus:outline-none transition bg-blue-50 text-gray-700 font-medium placeholder-blue-300" />

        <div *ngIf="f.identity.invalid && f.identity.touched" id="login-identity-error" class="text-red-700 text-xs font-bold mt-1 ml-2">
          <img src="assets/icons/warning.svg" alt="" aria-hidden="true" class="app-icon" /> Enter your username or email.
        </div>
      </div>

      <div class="relative">
        <label for="login-password" class="block text-purple-700 font-bold mb-2 ml-1">Password</label>
        <div class="relative">
          <input
            formControlName="password"
            id="login-password" autocomplete="current-password"
            [type]="showPassword ? 'text' : 'password'"
            placeholder="••••••••"
            [class.border-red-400]="f.password.invalid && f.password.touched" [attr.aria-invalid]="!!(f.password.invalid && f.password.touched)" [attr.aria-describedby]="f.password.invalid && f.password.touched ? 'login-password-error' : null"
            class="auth-input w-full px-5 py-4 rounded-2xl border-4 border-pink-200 focus:border-pink-400 focus:outline-none transition bg-pink-50 text-gray-700 font-medium placeholder-pink-300" />

          <button
            type="button"
            (click)="togglePassword()"
            class="ui-button ui-button-soft ui-button-icon password-toggle absolute right-4 top-1/2 -translate-y-1/2 text-xl">
            <img [src]="showPassword ? 'assets/icons/eye-off.svg' : 'assets/icons/eye.svg'" [alt]="showPassword ? 'Hide password' : 'Show password'" class="app-icon" />
          </button>
        </div>

        <div *ngIf="f.password.invalid && f.password.touched" id="login-password-error" class="text-red-700 text-xs font-bold mt-1 ml-2">
          <img src="assets/icons/warning.svg" alt="" aria-hidden="true" class="app-icon" /> Enter your password.
        </div>
      </div>

      <div class="flex items-center justify-between px-1">
        <label class="ui-check-label"><input type="checkbox" formControlName="rememberMe" class="ui-check" /> <span>Remember me for 30 days</span></label>
      </div>

      <button type="submit"
        [disabled]="loginForm.invalid || isSubmitting()"
        class="ui-button ui-button-green w-full py-4 text-base tracking-wide mt-2">
        <img src="assets/icons/games.svg" alt="" aria-hidden="true" class="app-icon" /> {{ isSubmitting() ? 'LOGGING IN…' : 'LOG IN & CONTINUE' }}
      </button>

    </form>

    <div class="mt-8 text-center border-t-4 border-dashed border-gray-100 pt-6">
      <p class="text-gray-600 font-medium">
        New to the game?
        <a routerLink="/signup" [queryParams]="{ returnUrl: returnUrl }" class="text-purple-700 font-extrabold hover:underline ml-1">Create Account</a>
      </p>
    </div>

  </section>
</main>
